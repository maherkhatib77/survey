<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوصلة نت</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #fafafa 0%, #f4f4f5 100%);
            display: flex;
            flex-direction: column;
            direction: rtl;
        }
        body[dir="rtl"] { direction: rtl; }
        body[dir="ltr"] { direction: ltr; }

        /* Apply Cairo font for headings in Arabic */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cairo', 'Noto Sans Arabic', sans-serif;
        }

        /* ── Header - Enhanced Modern Design ── */
        .hp-header {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,.12), 0 0 0 1px rgba(255,255,255,0.1);
        }
        .hp-header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .hp-logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
        }
        .hp-logo-img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,.5);
            background: rgba(255,255,255,.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,.2), 0 0 20px rgba(13, 148, 136, 0.3);
            transition: var(--transition-spring);
        }
        .hp-logo-img:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 6px 20px rgba(0,0,0,.25), 0 0 30px rgba(13, 148, 136, 0.4);
        }
        .hp-logo-img img { width: 100%; height: 100%; object-fit: cover; }
        .hp-site-name {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,.2);
            line-height: 1.3;
            letter-spacing: -0.3px;
        }
        
        /* ── Navigation - Enhanced ── */
        .hp-nav {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafb 100%);
            border-bottom: 1px solid #e4e4e7;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
        }
        .hp-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .hp-nav-inner::-webkit-scrollbar { height: 0; }
        .hp-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 22px;
            font-size: 15.5px;
            font-weight: 600;
            font-family: 'Noto Sans Arabic', sans-serif;
            color: #4c6373;
            text-decoration: none;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: var(--transition-spring);
            border-radius: 8px 8px 0 0;
            position: relative;
            overflow: hidden;
        }
        .hp-nav-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(13, 148, 136, 0.08) 0%, transparent 100%);
            opacity: 0;
            transition: var(--transition);
        }
        .hp-nav-link:hover::before {
            opacity: 1;
        }
        .hp-nav-link:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(13, 148, 136, 0.06);
            transform: translateY(-2px);
        }

        /* ── Content Area ── */
        .hp-content-area {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            display: grid;
            grid-template-columns: 1fr 4fr;
            gap: 32px;
        }

        /* Sidebar - Enhanced */
        .hp-sidebar {
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            border: 1px solid #e4e4e7;
            border-radius: var(--border-radius-xl);
            padding: 28px;
            font-size: 14.5px;
            line-height: 1.9;
            color: #52525b;
            word-break: break-word;
            align-self: start;
            position: sticky;
            top: 100px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .hp-sidebar:hover {
            box-shadow: var(--shadow-lg);
        }
        .hp-sidebar a { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600;
            transition: var(--transition);
        }
        .hp-sidebar a:hover { 
            text-decoration: underline; 
            color: var(--primary-dark);
        }

        /* Main - Enhanced */
        .hp-main {
            font-size: 16.5px;
            line-height: 2;
            color: #27272a;
            word-break: break-word;
            background: white;
            padding: 32px;
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow);
            border: 1px solid #f4f4f5;
        }

        /* ── Rich Text Styles (for Quill WYSIWYG content) - Enhanced ── */
        .hp-main h1 { 
            font-size: 32px; 
            font-weight: 800; 
            margin: 0 0 16px 0; 
            color: var(--gray-800); 
            line-height: 1.3;
            background: linear-gradient(135deg, var(--gray-800) 0%, var(--secondary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hp-main h2 { 
            font-size: 26px; 
            font-weight: 700; 
            margin: 24px 0 12px; 
            color: var(--secondary); 
            line-height: 1.4; 
        }
        .hp-main h3 { 
            font-size: 20px; 
            font-weight: 700; 
            margin: 20px 0 10px; 
            color: var(--primary-dark); 
            line-height: 1.4; 
        }
        .hp-main p { margin: 14px 0; }
        .hp-main ul, .hp-main ol { padding-right: 24px; margin: 14px 0; }
        .hp-main ul { list-style-type: disc; }
        .hp-main ol { list-style-type: decimal; }
        .hp-main li { margin: 6px 0; }
        .hp-main blockquote { 
            border-right: 5px solid var(--primary); 
            padding: 16px 24px; 
            margin: 20px 0; 
            background: linear-gradient(135deg, var(--primary-bg) 0%, rgba(13, 148, 136, 0.05) 100%); 
            border-radius: 0 12px 12px 0; 
            color: var(--gray-700);
            font-style: italic;
            box-shadow: var(--shadow-xs);
        }
        .hp-main a { 
            color: var(--primary); 
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .hp-main a:hover { 
            text-decoration: underline;
            color: var(--primary-dark);
        }
        .hp-main img { 
            max-width: 100%; 
            height: auto; 
            border-radius: var(--border-radius-lg); 
            margin: 16px 0;
            box-shadow: var(--shadow-md);
        }
        .hp-main strong { font-weight: 700; }
        .hp-main em { font-style: italic; }

        /* ── Footer - Enhanced ── */
        .hp-footer {
            text-align: center;
            padding: 28px 24px;
            border-top: 1px solid #e4e4e7;
            background: linear-gradient(180deg, #f8fafb 0%, #f4f4f5 100%);
            font-size: 14px;
            color: var(--gray-500);
            flex-shrink: 0;
            margin-top: auto;
        }
        .hp-footer a { 
            color: var(--primary); 
            text-decoration: none;
            font-weight: 600;
        }
        .hp-footer a:hover { 
            text-decoration: underline;
            color: var(--primary-dark);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .hp-header-inner { flex-wrap: wrap; padding: 16px 18px; }
            .hp-site-name { font-size: 19px; }
            .hp-logo-img { width: 48px; height: 48px; font-size: 26px; }
            .hp-content-area { grid-template-columns: 1fr; padding: 24px 18px; gap: 24px; }
            .hp-sidebar { position: static; }
            .hp-nav-link { padding: 14px 16px; font-size: 14.5px; }
            .hp-main h1 { font-size: 26px; }
            .hp-main h2 { font-size: 22px; }
            .hp-main h3 { font-size: 18px; }
            .hp-main { padding: 20px; }
        }
        @media (max-width: 480px) {
            .hp-site-name { font-size: 18px; }
            .hp-logo-area { gap: 12px; }
        }
    </style>
</head>
<body>
    <!-- 1. Header Section -->
    <header class="hp-header">
        <div class="hp-header-inner">
            <div class="hp-logo-area" id="hpLogoArea">
                <div class="hp-logo-img" id="globalHeaderLogo">🧭</div>
                <div class="hp-site-name" id="hpSiteName">بوصلة نت</div>
            </div>
        </div>
    </header>

    <!-- 2. Navigation Bar -->
    <nav class="hp-nav" id="hpNavBar">
        <div class="hp-nav-inner" id="hpNavInner"></div>
    </nav>

    <!-- 3 & 4. Content Area (Sidebar 20% + Main 80%) -->
    <div class="hp-content-area">
        <aside class="hp-sidebar" id="hpSidebar"></aside>
        <main class="hp-main" id="hpMain"></main>
    </div>

    <!-- 5. Footer Section -->
    <footer class="hp-footer" id="globalFooterText"></footer>

    <!-- TinyMCE (Rich Text Editor) -->
    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

    <script src="./js/data.js?v=4.5.0"></script>
    <script src="./js/global-ui.js?v=1.0.0"></script>
    <script>
        var currentLang = 'ar';

        function escapeHtml(str) {
            if (!str) return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function renderPage() {
            var hp = DataStore.getHomepage();
            var lang = currentLang;

            // Logo
            var logoEl = document.getElementById('globalHeaderLogo');
            if (hp.logo) {
                logoEl.innerHTML = '<img src="' + escapeHtml(hp.logo) + '" alt="logo">';
            } else {
                logoEl.innerHTML = '🧭';
            }

            // Site name
            var siteName = hp.siteName[lang] || hp.siteName.he || 'מצפן נט';
            document.getElementById('hpSiteName').textContent = siteName;
            document.title = siteName;

            // Nav items — each opens in a new tab
            var navItems = (hp.navItems || []).filter(function(n) { return n.isActive !== false; })
                .slice().sort(function(a,b) { return (a.order||0) - (b.order||0); });
            var navHtml = navItems.map(function(n) {
                var label = lang === 'ar' ? (n.labelAr || n.labelHe) : n.labelHe;
                return '<a class="hp-nav-link" href="' + escapeHtml(n.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>';
            }).join('');
            document.getElementById('hpNavInner').innerHTML = navHtml;

            // Show/hide nav bar
            document.getElementById('hpNavBar').style.display = navItems.length ? '' : 'none';

            // Sidebar items — each opens in a new tab (same as nav)
            var sidebarItems = (hp.sidebarItems || []).filter(function(n) { return n.isActive !== false; })
                .slice().sort(function(a,b) { return (a.order||0) - (b.order||0); });
            var sidebarHtml = '';
            if (sidebarItems.length) {
                sidebarHtml = '<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;">';
                sidebarItems.forEach(function(n) {
                    var label = lang === 'ar' ? (n.labelAr || n.labelHe) : n.labelHe;
                    sidebarHtml += '<li><a class="hp-nav-link" href="' + escapeHtml(n.url) + '" target="_blank" rel="noopener noreferrer" style="display:block;padding:10px 14px;border-radius:8px;border:1px solid #ececec;">' + escapeHtml(label) + '</a></li>';
                });
                sidebarHtml += '</ul>';
            }
            document.getElementById('hpSidebar').innerHTML = sidebarHtml;

            // Main content (rich text from Quill WYSIWYG — must use innerHTML)
            document.getElementById('hpMain').innerHTML = hp.mainContent[lang] || '';

            // Footer (supports HTML — links, copyright text, etc.)
            document.getElementById('globalFooterText').innerHTML = hp.footerText[lang] || '';
            if (typeof GlobalUI !== 'undefined') GlobalUI.apply(currentLang);
        }

        // Initialize
        if (DataStore.init && typeof DataStore.init === 'function') {
            var _t = setTimeout(function() { renderPage(); }, 5000);
            DataStore.init(false).then(function() { clearTimeout(_t); renderPage(); }).catch(function() { clearTimeout(_t); renderPage(); });
        } else {
            renderPage();
        }
    </script>
</body>
</html>
