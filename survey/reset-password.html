<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>איפוס סיסמה - Form Builder Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: linear-gradient(135deg,#1e293b 0%,#0f172a 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .reset-card { background:#fff; border-radius:20px; padding:40px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .reset-header { text-align:center; margin-bottom:24px; }
    .reset-header .icon { width:64px;height:64px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px; }
    .reset-header h1 { font-size:22px; color:var(--slate-800); margin-bottom:4px; }
    .reset-header p { color:var(--slate-500); font-size:14px; }
    .field-group { margin-bottom:16px; }
    .field-group label { font-size:14px; font-weight:600; color:var(--slate-700); margin-bottom:6px; display:block; }
    .field-group input { width:100%; padding:12px 16px; border:2px solid var(--slate-200); border-radius:10px; font-size:15px; font-family:inherit; }
    .field-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .btn-full { width:100%; padding:14px; font-size:16px; margin-top:8px; }
    .error-msg { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:12px; border-radius:10px; font-size:14px; display:none; margin-bottom:16px; }
    .success-msg { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:16px; border-radius:10px; font-size:14px; display:none; text-align:center; }
    .hint { font-size:12px; color:var(--slate-400); margin-top:6px; }
    .back-link { display:block; text-align:center; margin-top:20px; color:var(--slate-500); font-size:13px; text-decoration:none; }
    .back-link:hover { color:var(--primary); }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-header">
      <div class="icon">🔑</div>
      <h1>איפוס סיסמה</h1>
      <p>קבעו סיסמא חדשה לחשבון שלכם במערכת הסקרים</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="resetForm" style="display:none" onsubmit="handleReset(event)">
      <div class="field-group">
        <label for="newPassword">סיסמא חדשה</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="לפחות 8 תווים">
        <div class="hint">מינימום 8 תווים. מומלץ לשלב אותיות, מספרים וסימנים.</div>
      </div>
      <div class="field-group">
        <label for="confirmPassword">אימות סיסמא חדשה</label>
        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="הזינו שוב את הסיסמא">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="resetBtn">עדכן סיסמא</button>
    </form>

    <div class="success-msg" id="successMsg">
      ✅ הסיסמא עודכנה בהצלחה.<br>
      <a href="admin/login.html" style="color:#166534;font-weight:700">מעבר לדף ההתחברות ←</a>
    </div>

    <div id="loadingMsg" style="text-align:center;color:var(--slate-500);font-size:14px">⏳ בודק את תקינות קישור האיפוס...</div>

    <a href="admin/login.html" class="back-link">← חזרה להתחברות</a>
  </div>

  <script>
    const API = 'api';
    const tokenParams = new URLSearchParams(window.location.search).get('token') || '';

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = '❌ ' + msg;
      el.style.display = 'block';
      document.getElementById('loadingMsg').style.display = 'none';
    }

    async function getCsrfToken() {
      const c = document.cookie.match(/(?:^|;\s*)fb_csrf=([^;]*)/);
      if (c && /^[a-f0-9]{64}$/.test(decodeURIComponent(c[1]))) return decodeURIComponent(c[1]);
      try { await fetch(`${API}/auth.php?action=csrf-token`, { credentials: 'same-origin' }); } catch (e) {}
      const c2 = document.cookie.match(/(?:^|;\s*)fb_csrf=([^;]*)/);
      return c2 ? decodeURIComponent(c2[1]) : '';
    }

    async function init() {
      if (!tokenParams) {
        showError('קישור איפוס לא תקין – חסר טוקן. יש לבקש קישור חדש מדף ההתחברות.');
        return;
      }
      try {
        const res = await fetch(`${API}/auth.php?action=validate-reset-token&token=${encodeURIComponent(tokenParams)}`, { credentials: 'same-origin' });
        const json = await res.json();
        if (json.success && json.valid) {
          document.getElementById('loadingMsg').style.display = 'none';
          document.getElementById('resetForm').style.display = 'block';
          document.getElementById('newPassword').focus();
        } else {
          showError('הקישור אינו תקין או שפג תוקפו (תקף לשעה, לשימוש אחד). יש לבקש קישור חדש.');
        }
      } catch (e) {
        showError('שגיאת תקשורת מול השרת. נסו שוב מאוחר יותר.');
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const pw = document.getElementById('newPassword').value;
      const pw2 = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('errorMsg');
      const btn = document.getElementById('resetBtn');

      errEl.style.display = 'none';
      if (pw.length < 8) { showError('הסיסמא החדשה חייבת להכיל לפחות 8 תווים.'); return; }
      if (pw !== pw2)   { showError('אימות הסיסמא אינו תואם. נסו שוב.'); return; }

      btn.disabled = true;
      btn.textContent = '⏳ מעדכן...';
      try {
        const csrf = await getCsrfToken();
        const res = await fetch(`${API}/auth.php?action=reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
          credentials: 'same-origin',
          body: JSON.stringify({ token: tokenParams, newPassword: pw })
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.success) {
          document.getElementById('resetForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
          setTimeout(() => { window.location.href = 'admin/login.html'; }, 4000);
        } else {
          showError(json.error || 'שגיאה בעדכון הסיסמא. ייתכן שהקישור כבר פג.' );
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמא';
        }
      } catch (err) {
        showError('שגיאת תקשורת מול השרת.');
        btn.disabled = false;
        btn.textContent = 'עדכן סיסמא';
      }
    }

    init();
  </script>
</body>
</html>
