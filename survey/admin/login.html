<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כניסת מנהל - Form Builder Pro</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header .icon {
      width: 64px; height: 64px;
      background: var(--primary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
    }
    .login-header h1 { font-size: 24px; font-weight: 700; color: var(--slate-800); margin-bottom: 4px; }
    .login-header p { color: var(--slate-500); font-size: 14px; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-form .field-group { margin: 0; }
    .login-form .field-group label { font-size: 14px; font-weight: 600; color: var(--slate-700); margin-bottom: 6px; display: block; }
    .login-form input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--slate-200);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .login-form input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .login-form .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 8px;
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--slate-500);
      font-size: 13px;
      text-decoration: none;
    }
    .back-link:hover { color: var(--primary); }
    .default-creds {
      margin-top: 16px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 8px;
      font-size: 12px;
      color: #1e40af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="icon">🔐</div>
      <h1>כניסת מנהל</h1>
      <p>הזן פרטי התחברות כדי להמשיך</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="field-group">
        <label>שם משתמש</label>
        <input type="text" id="username" placeholder="הזן שם משתמש" required autocomplete="username">
      </div>
      <div class="field-group">
        <label>סיסמא</label>
        <input type="password" id="password" placeholder="הזן סיסמא" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">🔓 התחבר</button>
    </form>

    <a href="../index.html" class="back-link">← חזור לאתר הראשי</a>

    <div class="default-creds">
      <strong>פרטי התחברות ברירת מחדל:</strong><br>
      משתמש: <code>admin</code> | סיסמא: <code>admin123</code><br>
      <small>מומלץ לשנות סיסמא לאחר הכניסה הראשונה</small>
    </div>
  </div>

  <script>
    // בדיקה אם כבר מחובר
    async function checkAuth() {
      try {
        const res = await fetch('../api/auth.php?action=check');
        const json = await res.json();
        if (json.loggedIn) {
          window.location.href = 'dashboard.html';
        }
      } catch(e) {}
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = '⏳ מתחבר...';
      errorEl.style.display = 'none';

      try {
        const res = await fetch('../api/auth.php?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();

        if (json.success) {
          window.location.href = 'dashboard.html';
        } else {
          errorEl.textContent = '❌ ' + (json.error || 'שגיאה בהתחברות');
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = '❌ שגיאת תקשורת. נסה שוב.';
        errorEl.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = '🔓 התחבר';
    }

    checkAuth();
  </script>
</body>
</html>
