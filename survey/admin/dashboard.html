<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד מנהל - Form Builder Pro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">📋</div>
        <div>
          <h1>Form Builder Pro</h1>
          <p>אזור מנהל</p>
        </div>
      </a>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="userBadge" style="font-size:13px;color:var(--slate-600);background:var(--slate-100);padding:6px 12px;border-radius:20px;"></span>
        <a href="users.html" id="usersBtn" class="btn btn-outline btn-sm" style="display:none;">👥 משתמשים</a>
        <a href="../index.html" class="btn btn-outline btn-sm">🌐 לאתר</a>
        <button class="btn btn-outline btn-sm" onclick="logout()">🚪 יציאה</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="container" style="padding:32px 20px;">
    <!-- Stats -->
    <div class="stats-grid" id="stats"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <h2>הסקרים שלי</h2>
      <div style="display:flex;gap:12px;">
        <a href="sources.html" class="btn btn-outline btn-lg">🗄️ מאגרי נתונים</a>
        <a href="import.html" class="btn btn-outline btn-lg">📥 ייבוא מקובץ</a>
        <button class="btn btn-primary btn-lg" onclick="createNewForm()">➕ צור סקר חדש</button>
      </div>
    </div>

    <!-- Status Tabs -->
    <div class="status-tabs">
      <button class="status-tab active" onclick="switchStatusTab('all')" data-status="all">
        <span class="tab-icon">📋</span>
        <span class="tab-label">הכל</span>
        <span class="tab-count" id="count-all">0</span>
      </button>
      <button class="status-tab" onclick="switchStatusTab('draft')" data-status="draft">
        <span class="tab-icon">📝</span>
        <span class="tab-label">טיוטה</span>
        <span class="tab-count" id="count-draft">0</span>
      </button>
      <button class="status-tab" onclick="switchStatusTab('published')" data-status="published">
        <span class="tab-icon">✅</span>
        <span class="tab-label">מפורסם</span>
        <span class="tab-count" id="count-published">0</span>
      </button>
      <button class="status-tab" onclick="switchStatusTab('closed')" data-status="closed">
        <span class="tab-icon">🔒</span>
        <span class="tab-label">סגור</span>
        <span class="tab-count" id="count-closed">0</span>
      </button>
    </div>

    <!-- Forms List -->
    <div id="formsList" class="forms-grid"></div>
  </main>

  <!-- Delete Modal (ללא תגובות) -->
  <div id="deleteModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
      <h3>מחיקת סקר</h3>
      <p style="color:var(--slate-500);margin-bottom:24px;">האם אתה בטוח? פעולה זו בלתי הפיכה.</p>
      <div style="display:flex;gap:12px;">
        <button class="btn btn-danger" style="flex:1;" onclick="confirmDelete()">מחק</button>
        <button class="btn btn-outline" style="flex:1;" onclick="closeDeleteModal()">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Delete Modal with Password (עם תגובות) -->
  <div id="deleteModalWithPassword" class="modal-overlay" style="display:none;">
    <div class="modal" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
      <h3>מחיקת סקר עם תגובות</h3>
      <p style="color:var(--slate-500);margin:16px 0;">
        האם אתה בטוח שברצונך למחוק את הסקר?<br>
        <strong id="deleteFormTitle"></strong>
      </p>
      <p style="color:var(--danger);font-size:13px;margin-bottom:12px;">
        ⚠️ פעולה זו בלתי הפיכה ותמחק גם את כל התגובות!
      </p>
      <p style="color:var(--slate-600);font-size:14px;margin-bottom:20px;">
        מספר תגובות: <strong id="deleteResponseCount"></strong>
      </p>
      <div class="field-group" style="text-align:right;">
        <label style="font-weight:600;">הזן סיסמת מנהל:</label>
        <input type="password" id="deleteFormPassword" class="form-control" placeholder="סיסמה" style="margin-top:8px;">
      </div>
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn btn-outline" style="flex:1;" onclick="closeDeleteModal()">ביטול</button>
        <button class="btn btn-danger" style="flex:1;" onclick="confirmDeleteWithPassword()">מחק סקר</button>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
