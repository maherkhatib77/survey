<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול משתמשים - Form Builder Pro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="dashboard.html" class="btn btn-outline btn-sm">→ חזור</a>
        <div>
          <h1 style="font-size:18px;font-weight:700;">👥 ניהול משתמשים</h1>
          <p style="font-size:13px;color:var(--slate-500);">ניהול משתמשי המערכת והרשאות</p>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="showProfileModal()">👤 הפרופיל שלי</button>
        <a href="../index.html" class="btn btn-outline btn-sm">🌐 לאתר</a>
        <button class="btn btn-outline btn-sm" onclick="logout()">🚪 יציאה</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding:32px 20px;">
    <!-- Toolbar -->
    <div class="toolbar">
      <h2>משתמשי המערכת</h2>
      <button class="btn btn-primary btn-lg" onclick="showAddUserModal()">➕ הוסף משתמש חדש</button>
    </div>

    <!-- Users List -->
    <div id="usersList" class="forms-grid"></div>
  </main>

  <!-- Modal: Add/Edit User -->
  <div id="userModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="max-width:600px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 id="modalTitle" style="margin:0;">הוסף משתמש חדש</h3>
        <button onclick="closeUserModal()" style="background:none;border:none;cursor:pointer;font-size:20px;">✕</button>
      </div>
      
      <div class="field-group">
        <label>שם משתמש *</label>
        <input type="text" id="userUsername" class="form-control" placeholder="שם משתמש">
      </div>
      
      <div class="field-group">
        <label>שם מלא</label>
        <input type="text" id="userFullName" class="form-control" placeholder="שם מלא">
      </div>
      
      <div class="field-group">
        <label>אימייל</label>
        <input type="email" id="userEmail" class="form-control" placeholder="email@example.com">
      </div>
      
      <div class="field-group">
        <label>סיסמא *</label>
        <input type="password" id="userPassword" class="form-control" placeholder="סיסמא (מינימום 6 תווים)">
        <small class="form-text">לעריכה: השאר ריק אם לא ברצונך לשנות</small>
      </div>
      
      <div class="field-group">
        <label>תפקיד</label>
        <select id="userRole" class="form-control">
          <option value="user">משתמש רגיל</option>
          <option value="admin">מנהל</option>
        </select>
      </div>
      
      <div class="field-group">
        <label class="checkbox-label">
          <input type="checkbox" id="userActive" checked>
          <span>משתמש פעיל</span>
        </label>
      </div>
      
      <div id="permissionsSection">
        <label style="display:block;margin-bottom:8px;font-weight:600;">הרשאות</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <label class="checkbox-label">
            <input type="checkbox" id="permCreateForms" checked>
            <span>יצירת סקרים</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="permEditForms" checked>
            <span>עריכת סקרים</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="permDeleteForms">
            <span>מחיקת סקרים</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="permViewResponses" checked>
            <span>צפייה בתגובות</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="permExportData" checked>
            <span>ייצוא נתונים</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="permManageUsers">
            <span>ניהול משתמשים</span>
          </label>
        </div>
      </div>
      
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn btn-outline" style="flex:1;" onclick="closeUserModal()">ביטול</button>
        <button class="btn btn-primary" style="flex:1;" onclick="saveUser()">שמור</button>
      </div>
    </div>
  </div>

  <!-- Modal: Profile -->
  <div id="profileModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="max-width:500px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="margin:0;">👤 הפרופיל שלי</h3>
        <button onclick="closeProfileModal()" style="background:none;border:none;cursor:pointer;font-size:20px;">✕</button>
      </div>
      
      <div id="profileContent"></div>
    </div>
  </div>

  <!-- Modal: Reset Password -->
  <div id="resetPasswordModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="max-width:400px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="margin:0;">🔑 איפוס סיסמא</h3>
        <button onclick="closeResetPasswordModal()" style="background:none;border:none;cursor:pointer;font-size:20px;">✕</button>
      </div>
      
      <div class="field-group">
        <label>משתמש: <strong id="resetPasswordUser"></strong></label>
      </div>
      
      <div class="field-group">
        <label>סיסמא חדשה *</label>
        <input type="password" id="newPassword" class="form-control" placeholder="סיסמא חדשה (מינימום 6 תווים)">
      </div>
      
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button class="btn btn-outline" style="flex:1;" onclick="closeResetPasswordModal()">ביטול</button>
        <button class="btn btn-primary" style="flex:1;" onclick="resetPassword()">אפס סיסמא</button>
      </div>
    </div>
  </div>

  <script src="fb-auth.js"></script>
  <script src="users.js"></script>
</body>
</html>
