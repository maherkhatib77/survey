<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوصلة نت - طاقم المرشدين</title>
    <link rel="stylesheet" href="./css/style.css?v=5.3.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>
    <header class="team-header">
        <div class="team-header-inner">
            <h1 class="page-main-title">طاقم المرشدين</h1>
            <a href="./index.html" class="btn-back">← الرئيسية</a>
        </div>
    </header>

    <section class="search-section" aria-label="חיפוש מדריכים">
        <div class="search-wrapper">
            <input type="text" id="teamSearch" placeholder="بحث بالاسم، المنصب، التخصص، الهاتف أو البريد الإلكتروني..." aria-label="بحث مرشدين">
            <span class="search-icon">🔍</span>
            <button class="search-clear" id="searchClear" aria-label="مسح البحث">✕</button>
        </div>
        <div class="search-results-count" id="searchResultsCount"></div>
    </section>

    <main class="team-content">
        <div class="team-grid" id="teamGrid"></div>
        <div id="loadMoreContainer" style="text-align:center; margin-top:32px; display:none;">
            <button class="btn btn-outline btn-lg" id="loadMoreBtn">عرض المزيد من المرشدين ↓</button>
        </div>
    </main>

    <footer class="team-footer">
        بوصلة نت © <span id="footerYear"></span> | وزارة التربية والتعليم
    </footer>

    <!-- Modal (מבנה קבוע ב-HTML, מוסתר כברירת מחדל על ידי CSS) -->
    <div class="modal-overlay" id="guideModal" role="presentation" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <button class="modal-close" type="button" id="modalCloseBtn" aria-label="إغلاق">✕</button>
            <div class="modal-content">
                <div class="modal-image-side" id="modalImageSide">
                    <img class="modal-photo" id="modalPhoto" alt="" style="display:none;">
                    <div class="modal-photo-fallback" id="modalPhotoFallback" style="display:none;"><span id="modalInitials"></span></div>
                </div>
                <div class="modal-details-side">
                    <h2 class="modal-name" id="modalName"></h2>
                    <p class="modal-name-ar" id="modalNameAr" style="display:none;"></p>
                    <div class="modal-position-badge" id="modalPosition" style="display:none;"></div>
                    <div class="modal-detail-rows">
                        <div class="modal-detail-row" id="modalPhoneRow" style="display:none;">
                            <span class="modal-detail-icon">📞</span>
                            <div class="modal-detail-content">
                                <span class="modal-detail-label">هاتف</span>
                                <span class="modal-detail-value" id="modalPhone" dir="ltr"></span>
                            </div>
                        </div>
                        <div class="modal-detail-row" id="modalEmailRow" style="display:none;">
                            <span class="modal-detail-icon">📧</span>
                            <div class="modal-detail-content">
                                <span class="modal-detail-label">بريد إلكتروني</span>
                                <span class="modal-detail-value" id="modalEmail" dir="ltr"></span>
                            </div>
                        </div>
                        <div class="modal-detail-row" id="modalSpecsRow" style="display:none;">
                            <span class="modal-detail-icon">🎯</span>
                            <div class="modal-detail-content">
                                <span class="modal-detail-label">تخصصات</span>
                                <span class="modal-detail-value" id="modalSpecs" style="direction:rtl; text-align:right; white-space:pre-line;"></span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-actions" id="modalActions"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./js/data.js?v=30.8.0"></script>
    <script src="./js/global-ui.js?v=30.8.0"></script>
  
    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();

        // ==========================================
        // משתנים גלובליים
        // ==========================================
        var allGuides = [];
        var displayedCount = 0;
        var ITEMS_PER_PAGE = 50;

        // ==========================================
        // פונקציות עזר
        // ==========================================
        function escapeHtml(str) {
            if (!str) return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function toWhatsAppUrl(phone) {
            if (!phone) return '';
            var digits = phone.replace(/[^\d+]/g, '');
            if (digits.indexOf('0') === 0) digits = '972' + digits.substring(1);
            return 'https://wa.me/' + digits;
        }

        function getInitials(name) {
            if (!name) return '?';
            var parts = name.trim().split(/\s+/).filter(function(p) { return p.length > 0; });
            return parts.length > 0 ? parts[0].charAt(0) : '?';
        }

        var cardGradients = [
            'linear-gradient(135deg, #0ca7aa 0%, #09787a 100%)',
            'linear-gradient(135deg, #0e8a8d 0%, #0a5c5e 100%)',
            'linear-gradient(135deg, #00b8b8 0%, #09787a 100%)',
            'linear-gradient(135deg, #0ca7aa 0%, #0e5a5d 100%)',
            'linear-gradient(135deg, #0e5a5d 0%, #0f1820 100%)',
            'linear-gradient(135deg, #09787a 0%, #0ca7aa 100%)'
        ];

        // ==========================================
        // פונקציית פתיחת המודאל (תדרוס כל פונקציה קודמת)
        // ==========================================
		function showGuideModal(idx) {
			console.log('🔥 showGuideModal הופעלה! אינדקס:', idx, 'סהכ רשומות:', allGuides.length);
			
			var g = allGuides[idx];
			if (!g) {
				console.error('❌ לא נמצא מדריך באינדקס:', idx);
				return;
			}

			var gradient = cardGradients[idx % cardGradients.length];
			document.getElementById('modalImageSide').style.background = gradient;

			var photoEl = document.getElementById('modalPhoto');
			var fallbackEl = document.getElementById('modalPhotoFallback');
			
			// 🔑 הגדרת המשתנים הנכונים
			var nameHe = g.fullName || 'بدون اسم';
			var nameAr = g.fullNameAr || '';

			if (g.profileImage) {
				// 🔑 הוספת cache buster למודאל גם כן
				var cacheBuster = '?t=' + new Date().getTime();
				photoEl.src = g.profileImage + cacheBuster;
				photoEl.alt = nameHe;
				photoEl.style.display = 'block';
				photoEl.onerror = function() {
					this.style.display = 'none';
					fallbackEl.style.display = 'flex';
				};
				fallbackEl.style.display = 'none';
			} else {
				var initials = nameAr ? nameAr.charAt(0) : (nameHe ? nameHe.charAt(0) : '?');
				document.getElementById('modalInitials').textContent = initials;
				photoEl.style.display = 'none';
				fallbackEl.style.display = 'flex';
			}

			document.getElementById('modalName').textContent = nameHe;
			var nameArEl = document.getElementById('modalNameAr');
			if (nameAr) { nameArEl.textContent = nameAr; nameArEl.style.display = 'block'; }
			else { nameArEl.style.display = 'none'; }

			var positionEl = document.getElementById('modalPosition');
			if (g.position) { positionEl.textContent = g.position; positionEl.style.display = 'inline-block'; }
			else { positionEl.style.display = 'none'; }

			if (g.phone) { document.getElementById('modalPhone').textContent = g.phone; document.getElementById('modalPhoneRow').style.display = 'flex'; }
			else { document.getElementById('modalPhoneRow').style.display = 'none'; }

			if (g.email) { document.getElementById('modalEmail').textContent = g.email; document.getElementById('modalEmailRow').style.display = 'flex'; }
			else { document.getElementById('modalEmailRow').style.display = 'none'; }

			if (g.specializations) { document.getElementById('modalSpecs').textContent = g.specializations; document.getElementById('modalSpecsRow').style.display = 'flex'; }
			else { document.getElementById('modalSpecsRow').style.display = 'none'; }

			var actionsHtml = '';
			if (g.phone) {
				actionsHtml += '<a class="modal-btn modal-btn--whatsapp" href="https://wa.me/' + g.phone.replace(/[^\d+]/g, '').replace(/^0/, '972') + '" target="_blank" rel="noopener"><span class="btn-icon">💬</span> واتساب</a>';
			}
			if (g.email) {
				actionsHtml += '<a class="modal-btn modal-btn--email" href="mailto:' + g.email + '" target="_blank" rel="noopener"><span class="btn-icon">📧</span> بريد إلكتروني</a>';
			}
			actionsHtml += '<button class="modal-btn modal-btn--full" style="background: var(--gray-100); color: var(--gray-700);" onclick="closeGuideModal()">إغلاق</button>';
			
			document.getElementById('modalActions').innerHTML = actionsHtml;

			// 🔑 ביטול ה-display: none שמגיע מה-CSS
			var overlay = document.getElementById('guideModal');
			overlay.style.display = 'flex';       
			overlay.classList.add('active');
			overlay.style.opacity = '1';
			overlay.style.visibility = 'visible';
			document.body.style.overflow = 'hidden';
		}

        // ==========================================
        // פונקציית סגירת המודאל
        // ==========================================
		function closeGuideModal() {
			var overlay = document.getElementById('guideModal');
			overlay.style.display = 'none';       // מסתיר חזרה
			overlay.classList.remove('active');
			overlay.style.opacity = '';
			overlay.style.visibility = '';
			document.body.style.overflow = '';
		}

        // ==========================================
        // פונקציית רינדור
        // ==========================================
		function renderTeam(reset) {
			if (reset === undefined) reset = true;
			var grid = document.getElementById('teamGrid');
			var loadMoreContainer = document.getElementById('loadMoreContainer');
			var filter = document.getElementById('teamSearch').value.trim().toLowerCase();

			if (reset) {
				displayedCount = 0;
				grid.innerHTML = '';
				
				var rawGuides = DataStore.getAll(DataStore.KEYS.GUIDES_REPO) || [];

				if (filter) {
					allGuides = rawGuides.filter(function(g) {
						return (g.fullName || '').toLowerCase().indexOf(filter) !== -1 ||
							   (g.fullNameAr || '').toLowerCase().indexOf(filter) !== -1 ||
							   (g.position || '').toLowerCase().indexOf(filter) !== -1 ||
							   (g.phone || '').indexOf(filter) !== -1 ||
							   (g.email || '').toLowerCase().indexOf(filter) !== -1;
					});
				} else {
					allGuides = rawGuides.slice();
				}

				var countEl = document.getElementById('searchResultsCount');
				var clearBtn = document.getElementById('searchClear');
				if (filter) {
					countEl.textContent = 'تم العثور على ' + allGuides.length + ' مرشدين';
					clearBtn.classList.add('visible');
				} else {
					countEl.textContent = '';
					clearBtn.classList.remove('visible');
				}

				if (allGuides.length === 0) {
					grid.innerHTML = '<div class="team-empty"><div class="team-empty-icon">👥</div><div class="team-empty-text">لم يتم العثور على نتائج</div></div>';
					loadMoreContainer.style.display = 'none';
					return;
				}
			}

			var nextBatch = allGuides.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
			var startIndex = displayedCount;
			displayedCount += nextBatch.length;

			var html = '';
			for (var i = 0; i < nextBatch.length; i++) {
				var g = nextBatch[i];
				var globalIndex = startIndex + i;
				var gradient = cardGradients[globalIndex % cardGradients.length];
				
				// 🔑 הגדרת המשתנים הנכונים
				var nameHe = g.fullName || 'بدون اسم';
				var nameAr = g.fullNameAr || '';
				var initials = getInitials(nameAr || nameHe);

				// 🔑 תיקון קריטי: שימוש ב-nameHe, הוספת Cache Buster, וטיפול ב-onerror למקרה שהתמונה לא נטענת
				var avatarHtml;
				if (g.profileImage) {
					var cacheBuster = '?t=' + new Date().getTime();
					avatarHtml = '<img class="card-avatar" src="' + g.profileImage + cacheBuster + '" alt="' + escapeHtml(nameHe) + '" loading="lazy" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
								 '<div class="card-avatar-fallback" style="display:none;"><span>' + escapeHtml(initials) + '</span></div>';
				} else {
					avatarHtml = '<div class="card-avatar-fallback"><span>' + escapeHtml(initials) + '</span></div>';
				}

				html += '<article class="guide-card" data-index="' + globalIndex + '" tabindex="0">' +
					'<div class="card-header" style="background:' + gradient + ';">' + avatarHtml + '</div>' +
					'<div class="card-body">' +
						'<h3 class="card-name">' + escapeHtml(nameHe) + '</h3>' +
						(nameAr ? '<p class="card-name-ar">' + escapeHtml(nameAr) + '</p>' : '') +
						'<p class="card-position">' + escapeHtml(g.position || '') + '</p>' +
						'<button class="card-details-btn" type="button">المزيد من التفاصيل <span class="btn-arrow">←</span></button>' +
					'</div>' +
				'</article>';
			}

			grid.insertAdjacentHTML('beforeend', html);

			if (displayedCount < allGuides.length) {
				loadMoreContainer.style.display = 'block';
			} else {
				loadMoreContainer.style.display = 'none';
			}
		}

        // ==========================================
        // חיבור כל האירועים (Event Delegation)
        // ==========================================
        function bindEvents() {
            // 1. לחיצה על כרטיסייה או כפתור - פתיחת המודאל
            document.getElementById('teamGrid').addEventListener('click', function(e) {
                var card = e.target.closest('.guide-card');
                if (card) {
                    var index = parseInt(card.getAttribute('data-index'), 10);
                    console.log('🎯 נלחצה כרטיס/כפתור, אינדקס:', index);
                    showGuideModal(index);
                }
            });

            // 2. לחיצה על רקע המודאל או כפתור X - סגירה
            document.getElementById('guideModal').addEventListener('click', function(e) {
                if (e.target === this || e.target.closest('.modal-close') || e.target.id === 'modalCloseBtn2') {
                    hideGuideModal();
                }
            });

            // 3. מקש Escape - סגירה
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') hideGuideModal();
            });

            // 4. חיפוש
            var searchTimeout;
            document.getElementById('teamSearch').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() { renderTeam(true); }, 300);
            });

            // 5. ניקוי חיפוש
            document.getElementById('searchClear').addEventListener('click', function() {
                document.getElementById('teamSearch').value = '';
                document.getElementById('teamSearch').focus();
                renderTeam(true);
            });

            // 6. טעינה נוספת
            document.getElementById('loadMoreBtn').addEventListener('click', function() {
                renderTeam(false);
            });
        }

        // ==========================================
        // אתחול הדף
        // ==========================================
        if (typeof DataStore !== 'undefined' && DataStore.init) {
            DataStore.init(false).then(function() {
                renderTeam(true);
                bindEvents();
                if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar');
            }).catch(function() {
                renderTeam(true);
                bindEvents();
            });
        } else {
            renderTeam(true);
            bindEvents();
        }
    </script>
</body>
</html>
