<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצפן נט - לוח בקרה</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>
    <div class="app-layout">
        <!-- סרגל צד (Sidebar) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🧭</div>
                <div>
                    <div class="sidebar-title">מצפן נט</div>
                    <div class="sidebar-subtitle">מעקב פתרונות למידה</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- יטען דינמית על ידי App.renderSidebar() -->
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" onclick="Auth.logout()" style="cursor:pointer;" title="התנתק">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="user-info">
                        <div class="user-name" id="userName">טוען...</div>
                        <div class="user-role" id="userRole">...</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- כיסוי למובייל -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.closeSidebarMobile()"></div>

        <!-- תוכן ראשי -->
        <main class="main-content">
            <header class="app-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="App.toggleSidebarMobile()">☰</button>
                    <h1 class="header-title" id="headerTitle">⏳ טוען מערכת...</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ הדפסה</button>
                </div>
            </header>

            <div class="page-content" id="pageContent">
                <!-- כל החלונות (Sections) מוגדרים מראש כדי ש-App.showSection יוכל להציג אותם -->
                <div id="section-dashboard" class="section-page"></div>
                <div id="section-solutions" class="section-page"></div>
				<div id="section-clusters" class="section-page"></div>
                <div id="section-instructors" class="section-page"></div>
                <div id="section-guides" class="section-page"></div>
                <div id="section-guides-repo" class="section-page"></div>
                <div id="section-budgets" class="section-page"></div>
                <div id="section-periods" class="section-page"></div>
                <div id="section-lookup-tables" class="section-page"></div>
                <div id="section-registrations" class="section-page"></div>
                <div id="section-permissions" class="section-page"></div>
                <div id="section-activity-log" class="section-page"></div>
                <div id="section-recycle-bin" class="section-page"></div>
                <div id="section-homepage" class="section-page"></div>
                <div id="section-faq" class="section-page"></div>
				<div id="section-workshop-bookings" class="section-page"></div>
				<div id="section-workshop-sim-bookings" class="section-page"></div>
                <div id="section-custom-pages" class="section-page"></div>
                <div id="section-settings" class="section-page"></div>
                <div id="section-new-solution" class="section-page"></div>
            </div>
            
            <footer class="app-footer">
                © מצפן נט — מרכז פיתוח סגלי הוראה, מזרח ירושלים
            </footer>
        </main>
    </div>

    <!-- חלון קופץ (Modal) -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)App.closeModal()">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">כותרת</h3>
                <button class="modal-close" onclick="App.closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- הודעות מערכת (Toast) -->
    <div class="toast-container" id="toastContainer"></div>
	
	<!-- טעינת TinyMCE מהתיקייה המקומית -->
	<script src="./tinymce/tinymce.min.js"></script>

	<!-- טעינת סקריפטים בסדר הנכון -->
	<script src="./js/data.js?v=4.5.0"></script>
	<script src="./js/auth.js?v=1.0.0"></script>

	<!-- 🔑 קריטי: טעינת ספריית SheetJS לייבוא וייצוא אקסל -->
	<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

	<script src="./js/app.js?v=4.6.0"></script>
    
    <script>
        async function _startApp() {
            console.log('[Dashboard] 📦 בדיקת טעינת קבצים...');
            
            if (typeof DataStore === 'undefined' || typeof App === 'undefined') {
                document.getElementById('headerTitle').innerHTML = '⚠️ שגיאת טעינה - קבצי JS לא נטענו. נסה Ctrl + F5';
                return;
            }

            try {
                console.log('[Dashboard] 🔐 בודק הרשאות...');
                const user = Auth.requireAuth(); 
                if (!user) {
                    console.log('[Dashboard] ⚠️ אין משתמש מחובר, מפנה להתחברות...');
                    window.location.href = './login.html';
                    return;
                }

                console.log('[Dashboard] 🔄 מאתחל DataStore...');
                await DataStore.init(false);
                console.log('[Dashboard] ✅ DataStore מוכן.');

                console.log('[Dashboard] ✅ משתמש מחובר:', user.fullName);
                document.getElementById('userName').textContent = user.fullName;
                document.getElementById('userRole').textContent = Auth.getRoleLabel(user.role);
                document.getElementById('userAvatar').textContent = user.fullName.charAt(0);

                console.log('[Dashboard] 🚀 מאתחל את המערכת...');
                App.init();
            } catch (err) {
                console.error('[Dashboard] ❌ שגיאה קריטית:', err);
                document.getElementById('headerTitle').innerHTML = '⚠️ שגיאת אתחול: ' + err.message;
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _startApp);
        } else {
            _startApp();
        }
    </script>
</body>
</html>
