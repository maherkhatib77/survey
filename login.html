<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - מצפן נט</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary, #0ca7aa) 0%, var(--primary-dark, #09787a) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Noto Sans Arabic', sans-serif;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo { font-size: 48px; margin-bottom: 16px; }
        .login-title { font-size: 24px; font-weight: 800; color: var(--gray-800); margin-bottom: 8px; }
        .login-subtitle { font-size: 14px; color: var(--gray-500); margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--gray-200); border-radius: 8px;
            font-size: 16px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(12, 167, 170, 0.1); }
        .btn-login {
            width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s;
            font-family: inherit;
        }
        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:disabled { background: var(--gray-300); cursor: not-allowed; }
        .error-msg { color: var(--danger, #e53e3e); font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">🧭</div>
        <h1 class="login-title">ברוכים הבאים למצפן נט</h1>
        <p class="login-subtitle">הזן את פרטי ההתחברות שלך כדי להמשיך</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">שם משתמש</label>
                <input type="text" id="username" class="form-input" placeholder="הזן שם משתמש" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">סיסמה</label>
                <input type="password" id="password" class="form-input" placeholder="הזן סיסמה" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">התחבר למערכת</button>
            <div class="error-msg" id="errorMsg">שם משתמש או סיסמה שגויים</div>
        </form>
    </div>

    <script src="./js/data.js?v=30.8.0"></script>
    <script src="./js/auth.js?v=30.8.0"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = 'מאמת...';
            errorMsg.style.display = 'none';

            try {
                await DataStore.init(false, [DataStore.KEYS.SETTINGS]);
                const result = await Auth.login(username, password);
                
                if (result && result.success) {
                    window.location.href = './dashboard.html';
                } else {
                    errorMsg.textContent = (result && result.message) ? result.message : 'שם משתמש או סיסמה שגויים';
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'התחבר למערכת';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMsg.textContent = 'שגיאת מערכת, נסה שוב מאוחר יותר';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'התחבר למערכת';
            }
        }

        // אם המשתמש כבר מחובר, הפנה אותו ישירות לדאשבורד
        (async function checkExistingSession() {
            try {
                if (Auth.getSession()) {
                    window.location.href = './dashboard.html';
                }
            } catch (e) {
                console.error('Session check error:', e);
            }
        })();
    </script>
</body>
</html>
