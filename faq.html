<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسئلة الشائعة — بوصلة نت</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>
    <!-- Header: כותרת גדולה מימין, כפתור חזרה משמאל -->
    <header class="faq-header">
        <div class="faq-header-inner">
            <h1 class="page-main-title">الأسئلة الشائعة</h1>
            <a href="./index.html" class="btn-back">← الرئيسية</a>
        </div>
    </header>

    <!-- Search -->
    <section class="search-section" aria-label="بحث في الأسئلة الشائعة">
        <div class="search-wrapper">
            <input type="text" id="faqSearch" placeholder="ابحث عن سؤال..." oninput="filterFAQ()" aria-label="بحث في الأسئلة">
            <span class="search-icon">🔍</span>
            <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="مسح البحث">✕</button>
        </div>
        <div class="search-results-count" id="searchResultsCount"></div>
    </section>

    <!-- Main Content -->
    <main class="faq-content" id="faqContainer"></main>

    <!-- Footer -->
    <footer class="faq-footer" id="globalFooterText">
        بوصلة نت © <span id="footerYear"></span> | وزارة التربية والتعليم
    </footer>

    <script src="./js/data.js?v=30.8.0"></script>
    <script src="./js/global-ui.js?v=30.8.0"></script>
    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();

        function escapeHtml(str) {
            if (!str) return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function renderFAQ(filter) {
            var items = (DataStore.getAll(DataStore.KEYS.FAQ_DATA) || [])
                .slice()
                .sort(function(a, b) { return (a.order || 0) - (b.order || 0); });
            var totalCount = items.length;

            if (filter) {
                var f = filter.toLowerCase();
                items = items.filter(function(item) {
                    return (item.titleAr || '').toLowerCase().indexOf(f) !== -1 ||
                           (item.titleHe || '').toLowerCase().indexOf(f) !== -1 ||
                           (item.answerAr || '').toLowerCase().indexOf(f) !== -1 ||
                           (item.answerHe || '').toLowerCase().indexOf(f) !== -1;
                });
            }

            var countEl = document.getElementById('searchResultsCount');
            var clearBtn = document.getElementById('searchClear');
            if (filter) {
                countEl.textContent = 'تم العثور على ' + items.length + ' أسئلة من أصل ' + totalCount;
                clearBtn.classList.add('visible');
            } else {
                countEl.textContent = '';
                clearBtn.classList.remove('visible');
            }

            var container = document.getElementById('faqContainer');
            if (!items.length) {
                container.innerHTML = '<div class="faq-empty">' +
                    '<div class="faq-empty-icon">❓</div>' +
                    '<div class="faq-empty-text">' + (filter ? 'لم يتم العثور على نتائج' : 'لا توجد أسئلة شائعة بعد') + '</div>' +
                    '<div class="faq-empty-sub">' + (filter ? 'حاول البحث بكلمات مختلفة' : 'يمكن إضافة أسئلة من لوحة التحكم') + '</div>' +
                '</div>';
                return;
            }

            var html = items.map(function(item, idx) {
                var title = item.titleAr || item.titleHe || '—';
                var answer = item.answerAr || item.answerHe || '';
                return '<div class="faq-item" onclick="toggleFAQ(this)">' +
                    '<div class="faq-item-header">' +
                        '<div class="faq-item-icon">❓</div>' +
                        '<div class="faq-item-title">' + escapeHtml(title) + '</div>' +
                        '<div class="faq-item-arrow">▼</div>' +
                    '</div>' +
                    '<div class="faq-item-body">' +
                        '<div class="faq-item-answer">' + answer + '</div>' +
                    '</div>' +
                '</div>';
            }).join('');

            container.innerHTML = html;

            if (!filter && items.length > 0) {
                var first = container.querySelector('.faq-item');
                if (first) first.classList.add('open');
            }
        }

        function toggleFAQ(el) {
            el.classList.toggle('open');
        }

        function filterFAQ() {
            renderFAQ(document.getElementById('faqSearch').value.trim());
        }

        function clearSearch() {
            var input = document.getElementById('faqSearch');
            input.value = '';
            input.focus();
            renderFAQ();
        }

        if (DataStore.init && typeof DataStore.init === 'function') {
            var _t = setTimeout(function() { renderFAQ(); if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar'); }, 5000);
            DataStore.init(false).then(function() { clearTimeout(_t); renderFAQ(); if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar'); }).catch(function() { clearTimeout(_t); renderFAQ(); if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar'); });
        } else {
            renderFAQ();
            if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar');
        }
    </script>
</body>
</html>
