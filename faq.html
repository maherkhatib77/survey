<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسئلة الشائعة — بوصلة نت</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif;
            min-height: 100vh;
            background: var(--gray-50, #f3f3f3);
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .faq-header {
            background: linear-gradient(135deg, #0ca7aa 0%, #09787a 100%);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }
        .faq-header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .faq-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            text-decoration: none;
        }
        .faq-logo-icon { font-size: 32px; line-height: 1; }
        .faq-logo-text { font-size: 20px; font-weight: 800; color: #fff; }
        .faq-logo-sub { font-size: 13px; color: rgba(255,255,255,.75); font-weight: 500; }
        .btn-back {
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.3);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back:hover { background: rgba(255,255,255,.3); }

        /* ── Search Section ── */
        .search-section {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 24px 0;
        }
        .search-wrapper {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
        }
        .search-wrapper .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            pointer-events: none;
            color: #a0aec0;
            transition: color .2s;
        }
        .search-wrapper input {
            width: 100%;
            padding: 16px 50px 16px 48px;
            border-radius: 16px;
            border: 2px solid #e5e5e5;
            background: #fff;
            color: #1a1a1a;
            font-size: 16px;
            font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif;
            transition: all .25s;
            box-shadow: 0 2px 12px rgba(0,0,0,.04);
        }
        .search-wrapper input::placeholder { color: #a0aec0; }
        .search-wrapper input:focus {
            outline: none;
            border-color: #0ca7aa;
            box-shadow: 0 4px 20px rgba(12,167,170,.12);
        }
        .search-wrapper input:focus ~ .search-icon { color: #0ca7aa; }
        .search-clear {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #cbd5e0;
            padding: 4px;
            line-height: 1;
            display: none;
            transition: color .2s;
        }
        .search-clear:hover { color: #e53e3e; }
        .search-clear.visible { display: block; }
        .search-results-count {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #718096;
            font-weight: 500;
            min-height: 22px;
        }

        /* ── Content ── */
        .faq-content {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* ── FAQ Item (Yellow Pages accordion style) ── */
        .faq-item {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            overflow: hidden;
            border: 1px solid #edf2f7;
            margin-bottom: 16px;
            transition: all .25s ease;
        }
        .faq-item:hover {
            box-shadow: 0 6px 24px rgba(12,167,170,.12);
            transform: translateY(-1px);
        }
        .faq-item-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px;
            cursor: pointer;
            user-select: none;
            transition: background .15s;
        }
        .faq-item-header:hover { background: rgba(12,167,170,.04); }
        .faq-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0ca7aa, #09787a);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .faq-item-title {
            flex: 1;
            font-size: 17px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.5;
        }
        .faq-item-arrow {
            font-size: 18px;
            color: #a0aec0;
            transition: transform .3s ease;
            flex-shrink: 0;
        }
        .faq-item.open .faq-item-arrow { transform: rotate(180deg); }
        .faq-item-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
        }
        .faq-item.open .faq-item-body { max-height: 2000px; }
        .faq-item-answer {
            padding: 0 22px 20px 76px;
            font-size: 15px;
            line-height: 1.8;
            color: #555555;
            direction: rtl;
        }
        .faq-item-answer img { max-width: 100%; border-radius: 8px; }
        .faq-item-answer a { color: #0ca7aa; text-decoration: underline; }
        .faq-item-answer ul, .faq-item-answer ol { padding-right: 20px; margin: 8px 0; }
        .faq-item-answer li { margin-bottom: 4px; }

        /* ── Empty State ── */
        .faq-empty {
            text-align: center;
            padding: 80px 20px;
        }
        .faq-empty-icon { font-size: 64px; margin-bottom: 16px; }
        .faq-empty-text { font-size: 20px; color: #a0aec0; font-weight: 700; }
        .faq-empty-sub { font-size: 14px; color: #cbd5e0; margin-top: 8px; }

        /* ── Footer ── */
        .faq-footer {
            text-align: center;
            padding: 18px;
            color: #a0aec0;
            font-size: 12px;
            border-top: 1px solid #edf2f7;
            background: rgba(255,255,255,.7);
            flex-shrink: 0;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .faq-header-inner { flex-wrap: wrap; }
            .search-section { padding: 16px 16px 0; }
            .search-wrapper { max-width: 100%; }
            .search-wrapper input { padding: 14px 44px 14px 42px; font-size: 15px; }
            .faq-content { padding: 16px; }
            .faq-item-header { padding: 14px 16px; }
            .faq-item-answer { padding: 0 16px 16px 58px; font-size: 14px; }
            .faq-item-icon { width: 34px; height: 34px; font-size: 17px; border-radius: 10px; }
            .faq-item-title { font-size: 15px; }
        }
        @media (max-width: 480px) {
            .faq-logo-text { font-size: 17px; }
            .faq-item-answer { padding: 0 14px 14px 14px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="faq-header">
        <div class="faq-header-inner">
            <a class="faq-logo" href="./index.html">
                <span class="faq-logo-icon" id="globalHeaderLogo">🧭</span>
                <div>
                    <div class="faq-logo-text" id="globalHeaderNameAr">بوصلة نت</div>
                    <span id="globalHeaderNameHe" style="font-size:17px;font-weight:700;color:#fff;display:none;">מצפן נט</span>
                    <div class="faq-logo-sub">الأسئلة الشائعة</div>
                </div>
            </a>
            <a href="./index.html" class="btn-back">→ الرئيسية</a>
        </div>
    </header>

    <!-- Search -->
    <section class="search-section" aria-label="بحث في الأسئلة الشائعة">
        <div class="search-wrapper">
            <input type="text" id="faqSearch" placeholder="ابحث عن سؤال..." oninput="filterFAQ()" aria-label="بحث في الأسئلة">
            <span class="search-icon">🔍</span>
            <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="مسح البحث">✕</button>
        </div>
        <div class="search-results-count" id="searchResultsCount"></div>
    </section>

    <!-- Main Content -->
    <main class="faq-content" id="faqContainer"></main>

    <!-- Footer -->
    <footer class="faq-footer" id="globalFooterText">
        بوصلة نت © <span id="footerYear"></span> | وزارة التربية والتعليم
    </footer>

    <script src="./js/data.js?v=4.4.0"></script>
    <script src="./js/global-ui.js?v=1.0.0"></script>
    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();

        function escapeHtml(str) {
            if (!str) return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function renderFAQ(filter) {
            var items = (DataStore.getAll(DataStore.KEYS.FAQ_DATA) || [])
                .slice()
                .sort(function(a, b) { return (a.order || 0) - (b.order || 0); });
            var totalCount = items.length;

            if (filter) {
                var f = filter.toLowerCase();
                items = items.filter(function(item) {
                    return (item.titleAr || '').toLowerCase().indexOf(f) !== -1 ||
                           (item.titleHe || '').toLowerCase().indexOf(f) !== -1 ||
                           (item.answerAr || '').toLowerCase().indexOf(f) !== -1 ||
                           (item.answerHe || '').toLowerCase().indexOf(f) !== -1;
                });
            }

            var countEl = document.getElementById('searchResultsCount');
            var clearBtn = document.getElementById('searchClear');
            if (filter) {
                countEl.textContent = 'تم العثور على ' + items.length + ' أسئلة من أصل ' + totalCount;
                clearBtn.classList.add('visible');
            } else {
                countEl.textContent = '';
                clearBtn.classList.remove('visible');
            }

            var container = document.getElementById('faqContainer');
            if (!items.length) {
                container.innerHTML = '<div class="faq-empty">' +
                    '<div class="faq-empty-icon">❓</div>' +
                    '<div class="faq-empty-text">' + (filter ? 'لم يتم العثور على نتائج' : 'لا توجد أسئلة شائعة بعد') + '</div>' +
                    '<div class="faq-empty-sub">' + (filter ? 'حاول البحث بكلمات مختلفة' : 'يمكن إضافة أسئلة من لوحة التحكم') + '</div>' +
                '</div>';
                return;
            }

            var html = items.map(function(item, idx) {
                var title = item.titleAr || item.titleHe || '—';
                var answer = item.answerAr || item.answerHe || '';
                return '<div class="faq-item" onclick="toggleFAQ(this)">' +
                    '<div class="faq-item-header">' +
                        '<div class="faq-item-icon">❓</div>' +
                        '<div class="faq-item-title">' + escapeHtml(title) + '</div>' +
                        '<div class="faq-item-arrow">▼</div>' +
                    '</div>' +
                    '<div class="faq-item-body">' +
                        '<div class="faq-item-answer">' + answer + '</div>' +
                    '</div>' +
                '</div>';
            }).join('');

            container.innerHTML = html;

            // Auto-open first item when no search filter
            if (!filter && items.length > 0) {
                var first = container.querySelector('.faq-item');
                if (first) first.classList.add('open');
            }
        }

        function toggleFAQ(el) {
            el.classList.toggle('open');
        }

        function filterFAQ() {
            renderFAQ(document.getElementById('faqSearch').value.trim());
        }

        function clearSearch() {
            var input = document.getElementById('faqSearch');
            input.value = '';
            input.focus();
            renderFAQ();
        }

        // Initialize
        if (DataStore.init && typeof DataStore.init === 'function') {
            var _t = setTimeout(function() { renderFAQ(); if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar'); }, 5000);
            DataStore.init(false).then(function() { clearTimeout(_t); renderFAQ(); if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar'); }).catch(function() { clearTimeout(_t); renderFAQ(); if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar'); });
        } else {
            renderFAQ();
            if (typeof GlobalUI !== 'undefined') GlobalUI.apply('ar');
        }
    </script>
</body>
</html>
