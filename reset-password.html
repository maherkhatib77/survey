<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>איפוס סיסמה - מצפן נט</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body { background: linear-gradient(135deg,#0b3b3d 0%,#062a2b 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .reset-card { background:#fff; border-radius:20px; padding:40px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .reset-header { text-align:center; margin-bottom:24px; }
    .reset-header .icon { width:64px;height:64px;background:#0ca7aa;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;color:#fff; }
    .reset-header h1 { font-size:22px; color:#134e4a; margin-bottom:4px; }
    .reset-header p { color:#64748b; font-size:14px; }
    .field-group { margin-bottom:16px; }
    .field-group label { font-size:14px; font-weight:600; color:#334155; margin-bottom:6px; display:block; }
    .field-group input { width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:10px; font-size:15px; font-family:inherit; box-sizing:border-box; }
    .field-group input:focus { outline:none; border-color:#0ca7aa; box-shadow:0 0 0 3px rgba(12,167,170,.15); }
    .btn-full { width:100%; padding:14px; font-size:16px; margin-top:8px; border:none; border-radius:10px; background:#0ca7aa; color:#fff; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-full:disabled { opacity:.6; cursor:not-allowed; }
    .btn-full:hover:not(:disabled) { background:#0b8f92; }
    .msg { padding:12px; border-radius:10px; font-size:14px; display:none; margin-bottom:16px; word-break:break-word; }
    .msg.error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
    .msg.success { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; text-align:center; }
    .hint { font-size:12px; color:#94a3b8; margin-top:6px; }
    .back-link { display:block; text-align:center; margin-top:20px; color:#64748b; font-size:13px; text-decoration:none; }
    .back-link:hover { color:#0ca7aa; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-header">
      <div class="icon">🔑</div>
      <h1>איפוס סיסמה</h1>
      <p>קבעו סיסמא חדשה לחשבון שלכם במערכת ניהול האתר</p>
    </div>

    <div class="msg error" id="errorMsg"></div>

    <form id="resetForm" style="display:none" onsubmit="handleReset(event)">
      <div class="field-group">
        <label for="newPassword">סיסמא חדשה</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="לפחות 8 תווים">
        <div class="hint">מינימום 8 תווים. מומלץ לשלב אותיות, מספרים וסימנים.</div>
      </div>
      <div class="field-group">
        <label for="confirmPassword">אימות סיסמא חדשה</label>
        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="הזינו שוב את הסיסמא">
      </div>
      <button type="submit" class="btn-full" id="resetBtn">עדכן סיסמא</button>
    </form>

    <div class="msg success" id="successMsg">
      ✅ הסיסמא עודכנה בהצלחה.<br>
      <a href="./login.html" style="color:#166534;font-weight:700">מעבר לדף ההתחברות ←</a>
    </div>

    <div id="loadingMsg" style="text-align:center;color:#64748b;font-size:14px">⏳ בודק את תקינות קישור האיפוס...</div>

    <a href="./login.html" class="back-link">← חזרה להתחברות</a>
  </div>

  <script>
    const tokenParams = new URLSearchParams(window.location.search).get('token') || '';

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.className = 'msg error';
      el.textContent = '❌ ' + msg;
      el.style.display = 'block';
      document.getElementById('loadingMsg').style.display = 'none';
    }

    async function init() {
      if (!tokenParams) {
        showError('קישור איפוס לא תקין – חסר טוקן. יש לבקש קישור חדש מדף ההתחברות.');
        return;
      }
      try {
        const res = await fetch('./api/auth.php?action=validate_reset_token&token=' + encodeURIComponent(tokenParams), { credentials: 'same-origin' });
        const json = await res.json();
        if (json.success && json.valid) {
          document.getElementById('loadingMsg').style.display = 'none';
          document.getElementById('resetForm').style.display = 'block';
          document.getElementById('newPassword').focus();
        } else {
          showError('הקישור אינו תקין או שפג תוקפו (תקף לשעה, לשימוש אחד). יש לבקש קישור חדש.');
        }
      } catch (e) {
        showError('שגיאת תקשורת מול השרת. נסו שוב מאוחר יותר.');
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const pw = document.getElementById('newPassword').value;
      const pw2 = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('resetBtn');

      if (pw.length < 8) { showError('הסיסמא החדשה חייבת להכיל לפחות 8 תווים.'); return; }
      if (pw !== pw2)   { showError('אימות הסיסמא אינו תואם. נסו שוב.'); return; }

      btn.disabled = true;
      btn.textContent = '⏳ מעדכן...';
      try {
        const r = await fetch('./api/auth.php?action=reset_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token: tokenParams, password: pw })
        });
        const result = await r.json().catch(() => ({}));
        if (result && result.success) {
          document.getElementById('resetForm').style.display = 'none';
          const ok = document.getElementById('successMsg');
          ok.className = 'msg success';
          ok.style.display = 'block';
          setTimeout(() => { window.location.href = './login.html'; }, 4000);
        } else {
          showError((result && (result.message || result.error)) || 'שגיאה בעדכון הסיסמא. ייתכן שהקישור כבר פג.');
          btn.disabled = false;
          btn.textContent = 'עדכן סיסמא';
        }
      } catch (err) {
        console.error('Reset password error:', err);
        showError('שגיאת תקשורת מול השרת.');
        btn.disabled = false;
        btn.textContent = 'עדכן סיסמא';
      }
    }

    init();
  </script>
</body>
</html>
