<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مسبق - بوصلة نت | רישום מוקדם - מצפן נט</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <style>
        .registration-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #09787a 0%, #0ca7aa 40%, #09787a 65%, #0f1820 100%);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .registration-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .registration-wrapper::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(12,167,170,0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .registration-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: var(--border-radius-xl);
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.25), 0 10px 20px -8px rgba(0, 0, 0, 0.1);
            padding: 44px 40px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            animation: loginCardEnter 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .solution-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary-bg), #d0f0f0);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
            border: 1.5px solid rgba(12, 167, 170, 0.25);
        }
        .solution-badge .badge-icon {
            font-size: 18px;
        }
        .label-ar {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--gray-400);
            margin-top: 2px;
            direction: rtl;
        }
        .form-input[readonly] {
            background: var(--gray-100);
            color: var(--gray-600);
            cursor: default;
        }
        /* Autocomplete wrapper (multi-tag) */
        .autocomplete-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 44px;
            background: var(--white, #fff);
            border: 1.5px solid var(--gray-200, #e5e7eb);
            border-radius: var(--border-radius, 8px);
            padding: 4px 8px;
            cursor: text;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .autocomplete-wrapper:focus-within {
            border-color: var(--primary, #0ca7aa);
            box-shadow: 0 0 0 3px rgba(12, 167, 170, 0.1);
        }
        .autocomplete-wrapper .form-input {
            border: none;
            box-shadow: none;
            padding: 6px 4px;
            flex: 1;
            min-width: 100px;
            background: transparent;
        }
        .autocomplete-wrapper .form-input:focus {
            box-shadow: none;
            outline: none;
        }
        /* Institution tag — matches system badge-primary style */
        .institution-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-bg, #e9f6fb);
            color: var(--primary-dark, #09787a);
            padding: 5px 8px 5px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            max-width: 100%;
            animation: tagAppear 0.2s ease;
        }
        @keyframes tagAppear {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .institution-tag .tag-text {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tag-remove {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: var(--primary, #0ca7aa);
            border: none;
            color: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
            transition: opacity 0.2s;
            opacity: 0.75;
        }
        .tag-remove:hover {
            opacity: 1;
        }
        /* Autocomplete dropdown */
        .autocomplete-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            max-height: 220px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid var(--gray-200, #e5e7eb);
            border-radius: var(--border-radius, 8px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin-top: 4px;
        }
        .autocomplete-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .autocomplete-dropdown::-webkit-scrollbar-thumb {
            background: var(--gray-300, #d1d5db);
            border-radius: 3px;
        }
        .suggestion-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--gray-100, #f3f4f6);
            font-size: 14px;
            transition: background 0.15s;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover,
        .suggestion-item.active {
            background: var(--gray-50, #f9fafb);
        }
        .suggestion-item .sug-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .suggestion-item .sug-code {
            font-weight: 600;
            direction: ltr;
            display: inline-block;
            font-size: 12px;
            color: var(--gray-500);
            background: var(--gray-100, #f3f4f6);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .suggestion-item .sug-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .suggestion-item .sug-sub {
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 2px;
            padding-right: 4px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-dark);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            margin-top: 20px;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        .success-message {
            display: none;
            text-align: center;
            padding: 24px 16px;
        }
        .success-message .success-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--success-light), var(--success));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            box-shadow: 0 8px 24px -6px rgba(56, 161, 105, 0.4);
        }
        .success-message h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }
        .success-message p {
            color: var(--gray-500);
            font-size: 15px;
            margin-bottom: 4px;
        }
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        @media (max-width: 576px) {
            .registration-card {
                padding: 28px 20px;
                border-radius: var(--border-radius-lg);
            }
        }
    </style>
</head>
<body>
    <div class="registration-wrapper">
        <div class="registration-card">
                <div class="login-logo" id="globalHeaderLogo">🧭</div>
            <h1>מצפן נט</h1>
            <p class="subtitle">רישום מוקדם לפתרון למידה | משרד החינוך</p>

            <div id="solutionBadge" class="solution-badge" style="display:none;">
                <span class="badge-icon">📚</span>
                <span id="solutionName">פתרון למידה</span>
            </div>

            <!-- Registration Form -->
            <form id="registrationForm" novalidate style="text-align:right;">
                <div class="form-group">
                    <label for="fullName">
                        שם מלא
                        <span class="label-ar">الاسم الكامل</span>
                    </label>
                    <input type="text" id="fullName" class="form-input" placeholder="הכנס שם מלא" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="phone">
                        מספר נייד
                        <span class="label-ar">رقم الجوال</span>
                    </label>
                    <input type="tel" id="phone" class="form-input" placeholder="050-0000000" required autocomplete="tel" dir="ltr" style="text-align:right;">
                </div>

                <div class="form-group">
                    <label for="email">
                        כתובת דוא"ל
                        <span class="label-ar">البريد الإلكتروني</span>
                    </label>
                    <input type="email" id="email" class="form-input" placeholder="example@mail.com" required autocomplete="email" dir="ltr" style="text-align:right;">
                </div>

                <div class="form-group" style="position:relative;">
                    <label id="institutionLabel">
                        סמל מוסד / שם בית ספר
                        <span class="label-ar">رمز المؤسسة / اسم المدرسة</span>
                    </label>
                    <div class="autocomplete-wrapper" id="institutionWrapper">
                        <div id="institutionTags"></div>
                        <input type="text" id="institutionSearch" class="form-input" placeholder="🔍 חפש לפי סמל, שם..." autocomplete="off">
                    </div>
                    <input type="hidden" id="institutionCodes">
                    <div id="schoolSuggestions" class="autocomplete-dropdown"></div>
                </div>

                <div class="form-group">
                    <label for="role">
                        תפקיד
                        <span class="label-ar">المنصب</span>
                    </label>
                    <select id="role" class="form-select" required>
                        <option value="">-- בחר תפקיד / اختر المنصب --</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">
                    שליחה | إرسال
                </button>
            </form>

            <!-- Success Message (shown after submission) -->
            <div id="successMessage" class="success-message">
                <div class="success-icon">✅</div>
                <h2>הרישום נשלח בהצלחה!</h2>
                <p>تم إرسال التسجيل بنجاح!</p>
                <p style="margin-top:8px; font-size:13px;">נחזור אליך בהקדם האפשרי</p>
            </div>

            <a href="./catalog.html" class="back-link" id="backLink">
                ← חזרה לקטלוג | العودة للكتالوج
            </a>
        </div>
    </div>

    <div class="footer" id="globalFooterText">
        &copy; <span id="footerYear"></span> מצפן נט — משרד החינוך | بوصلة نت — وزارة التعليم
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="./js/data.js?v=4.4.0"></script>
    <script src="./js/global-ui.js?v=1.0.0"></script>
    <script src="./js/registration.js?v=4.5.0"></script>
</body>
</html>
